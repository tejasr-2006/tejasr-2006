name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # The default GITHUB_TOKEN can only see public data and produces
          # incomplete cards. Add a Personal Access Token as a repo secret
          # named PROFILE_README_TOKEN for full stats; falls back otherwise.
          GITHUB_TOKEN: ${{ secrets.PROFILE_README_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: "5.5"
          THEME: radical
          AUTO_PUSH: true
