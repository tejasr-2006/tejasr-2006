name: Update GitHub Contribution Streak

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch streak card
        run: |
          mkdir -p profile
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/streak.svg \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=dark&hide_border=true&ring=EF93C4&fire=FF69B4&currStreakLabel=EF93C4&sideLabels=F8BBD0&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=AAAAAA"
          # Only replace the old card if we really got an SVG back
          if grep -q "<svg" /tmp/streak.svg; then
            mv /tmp/streak.svg profile/streak.svg
          else
            echo "Response was not an SVG; keeping the existing card."
            exit 1
          fi

      - name: Commit streak image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update contribution streak" || exit 0
          git push
